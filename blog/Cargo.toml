[package]
name = "nur-blog"
description.workspace = true
readme.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
maud = "0.27"
percent-encoding = "2"
rust-i18n = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.62"

[build-dependencies]
lightningcss = "1.0.0-alpha.72"
oxc_allocator = "0.151"
oxc_codegen = "0.151"
oxc_minifier = "0.151"
oxc_parser = "0.151"
oxc_span = "0.151"
serde_json = "1"
