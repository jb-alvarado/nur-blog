[plugin]
id = "blog"
name = "Blog"
version = "0.1.0"
api_version = 1
cms_version = ">=0.20, <0.21"
module = "target/wasm32-wasip2/release/nur_blog.wasm"

[migrations]
directory = "migrations"

[assets]
directory = "assets"

[cache]
ttl_seconds = 43200
max_entries = 256

[[routes]]
id = "home"
method = "GET"
path = "/"
scope = "root"
access = "public"

[[routes]]
id = "pagination"
method = "GET"
path = "/page/{number}"
scope = "root"
access = "public"

[[routes]]
id = "article"
method = "GET"
path = "/{article_type}/{slug}"
scope = "root"
access = "public"

[[routes]]
id = "search"
method = "GET"
path = "/search"
scope = "root"
access = "public"

[[routes]]
id = "favicon"
method = "GET"
path = "/favicon.ico"
scope = "root"
access = "public"

[[routes]]
id = "page"
method = "GET"
path = "/{page_slug}"
scope = "root"
access = "public"

[[routes]]
id = "settings"
method = "GET"
path = "/settings"
access = "admin"

[[routes]]
id = "settings-update"
method = "PUT"
path = "/settings"
access = "admin"

[admin]
entry = "admin.min.js"
element = "nur-cms-blog-settings"
access = "admin"
styles = ["admin.min.css"]

[[admin.menu]]
label = "Settings"
labels = { de = "Einstellungen", en = "Settings" }
path = "/settings"
icon = "bi-journal-richtext"
access = "admin"
